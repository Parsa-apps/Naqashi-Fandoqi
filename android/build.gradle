// Top-level build file — فندوقی آفلاین
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

// نکته: repositoryهای پروژه در settings.gradle (dependencyResolutionManagement) تعریف شده‌اند
// و حالت FAIL_ON_PROJECT_REPOS اجازهٔ تعریف مجدد در build.gradle را نمی‌دهد.

task clean(type: Delete) {
    delete rootProject.buildDir
}
