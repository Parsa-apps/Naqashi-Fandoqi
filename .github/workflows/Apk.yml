name: 📱 Build Fandoqi APK — آفلاین برای همه گوشی‌ها

on:
  push:
    branches: [main, "arena/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: 🤖 Build APK (Universal)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 🤖 Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          LICENSE_STATUS="${PIPESTATUS[1]}"
          set -o pipefail
          test "$LICENSE_STATUS" -eq 0
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 🔄 Sync Web Assets to Android
        run: |
          rm -rf android/app/src/main/assets/www/*
          mkdir -p android/app/src/main/assets/www
          cp -r index.html manifest.json sw.js css js icons android/app/src/main/assets/www/

      - name: 🔧 Make gradlew executable
        run: chmod +x android/gradlew

      - name: 🏗️ Build APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease --stacktrace

      - name: 📏 Check APKs
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fandoqi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: fandoqi-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  deliver-apk:
    name: 📦 Save APK to current branch
    if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: 📥 Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: fandoqi-release-apk
          path: apk

      - name: 📦 Update latest APK
        run: mv apk/app-release.apk apk/fandoqi-latest.apk

      - name: 💾 Commit APK
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- apk/fandoqi-latest.apk)" ]; then
            echo "APK is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/fandoqi-latest.apk
          git commit -m "chore: update latest APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
