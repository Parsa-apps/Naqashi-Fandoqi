name: 📱 Build Fandoqi APK — آفلاین برای همه گوشی‌ها

# این ورک‌فلو در هر پوش، APK را از صفر می‌سازد و نسخه تازه را
# در فایل‌های `fandoqi.apk` و `apk/fandoqi-debug.apk` ریپو commit می‌کند
# تا فایل داخل ریپو همیشه هم‌نسخه با کد باشد (دیگر APK کهنه نمی‌شود).

on:
  push:
    branches: [ main, arena/* ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: 🤖 Build APK (Universal)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🧰 Install SDK packages (platform 34)
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: 🔄 Sync Web Assets to Android
        run: |
          rm -rf android/app/src/main/assets/www/*
          mkdir -p android/app/src/main/assets/www
          cp -r index.html manifest.json sw.js css js icons android/app/src/main/assets/www/
          echo "تعداد فایل‌های www: $(find android/app/src/main/assets/www -type f | wc -l)"

      - name: 🔧 Make gradlew executable
        run: chmod +x android/gradlew

      - name: 🏗️ Build Debug + Release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease --stacktrace

      - name: 📏 Check APKs
        run: |
          ls -lh android/app/build/outputs/apk/debug/*.apk
          ls -lh android/app/build/outputs/apk/release/*.apk
          echo "فایل‌های www داخل APK:"
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/www' | wc -l

      - name: ⬆️ Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fandoqi-apk-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: 📦 Commit fresh APKs into repo
        run: |
          # نسخه تازه را جایگزین فایل‌های کهنه داخل ریپو کن
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/fandoqi-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk fandoqi.apk
          git config user.name "fandoqi-build-bot"
          git config user.email "actions@github.com"
          git add fandoqi.apk apk/fandoqi-debug.apk
          if git diff --cached --quiet; then
            echo "APK تغییری نکرده — چیزی برای commit نیست"
          else
            git commit -m "📦 apk: auto-rebuild from ${GITHUB_SHA::7}"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
            echo "✅ APK تازه در ریپو commit شد"
          fi
